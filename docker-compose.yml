# Local development stack: Postgres + API + web. `docker compose up --build`, then
# `docker compose exec api python -m app.seed` and open http://localhost:3000 (sign in as admin@spark.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark-local-only
      POSTGRES_DB: authentic_spark
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: [./backend/.env.example]
    environment:
      DATABASE_URL: postgresql+asyncpg://spark:spark-local-only@db:5432/authentic_spark
      CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_AUTH_MODE: dev
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
