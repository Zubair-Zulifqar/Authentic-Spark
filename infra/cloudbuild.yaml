# Builds both images, runs backend tests, pushes to Artifact Registry and deploys to Cloud Run.
# Trigger manually or from a Cloud Build trigger: gcloud builds submit --config infra/cloudbuild.yaml \
#   --substitutions=_REGION=us-central1,_REPO=authentic-spark,_API_URL=https://api.example.org,...
substitutions:
  _REGION: us-central1
  _REPO: authentic-spark
  _API_URL: ""
  _FIREBASE_PROJECT_ID: ""
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_APP_ID: ""
  _CLOUDSQL_INSTANCE: ""   # project:region:instance
steps:
  - id: test-api
    name: python:3.12-slim
    dir: backend
    entrypoint: sh
    args: ["-c", "pip install -q -r requirements-dev.txt && pytest -q"]
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA", "backend"]
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA",
           "--build-arg", "NEXT_PUBLIC_API_URL=${_API_URL}", "--build-arg", "NEXT_PUBLIC_AUTH_MODE=firebase",
           "--build-arg", "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}",
           "--build-arg", "NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}",
           "--build-arg", "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}",
           "--build-arg", "NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}", "frontend"]
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args: ["-c", "docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA && docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA"]
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "spark-api", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA",
           "--service-account", "spark-api@$PROJECT_ID.iam.gserviceaccount.com",
           "--add-cloudsql-instances", "${_CLOUDSQL_INSTANCE}",
           "--set-env-vars", "APP_ENV=production,AUTH_MODE=firebase,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}",
           "--set-secrets", "DATABASE_URL=spark-database-url:latest,WEBHOOK_SIGNING_SECRET=spark-webhook-secret:latest,SCHEDULER_TOKEN=spark-scheduler-token:latest",
           "--min-instances", "0", "--max-instances", "5", "--no-allow-unauthenticated"]
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "spark-web", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA",
           "--min-instances", "0", "--max-instances", "3", "--allow-unauthenticated"]
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
